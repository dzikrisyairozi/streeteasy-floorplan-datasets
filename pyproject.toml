[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streeteasy-floorplans"
version = "0.1.0"
description = "Build a bedroom-categorized dataset of StreetEasy rental floor plans via the StreetEasy GraphQL API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dzikrisyairozi" }]
keywords = ["streeteasy", "real-estate", "floorplan", "dataset", "nyc", "scraper"]

# Runtime dependency. curl_cffi gives real Chrome TLS/JA3 + HTTP2 impersonation,
# which is what gets past StreetEasy's PerimeterX/HUMAN network-layer fingerprinting.
# The parser/dataset core is pure-stdlib and importable without this installed.
dependencies = [
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
streeteasy-floorplans = "streeteasy_floorplans.cli:main"

[project.urls]
Homepage = "https://github.com/dzikrisyairozi/streeteasy-floorplan-datasets"
Issues = "https://github.com/dzikrisyairozi/streeteasy-floorplan-datasets/issues"

[tool.setuptools.packages.find]
include = ["streeteasy_floorplans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
